<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Helvetica, Arial, sans-serif">
  <style>.cap{font-size:18px;font-weight:700;fill:#222;text-anchor:middle}</style>
  <rect width="240" height="240" fill="#fff"/>
  <g id="art" transform="translate(2.2 4.2) scale(0.983)">
  <!-- loop arcs -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M100 44 C60 50 44 84 50 118" stroke="#999"/>
    <path d="M44 110 L50 120 L58 112" stroke="#999" stroke-linejoin="round"/>
    <path d="M74 160 C100 180 140 180 166 160" stroke="#999"/>
    <path d="M156 158 L166 160 L164 150" stroke="#999" stroke-linejoin="round"/>
    <path d="M190 118 C196 96 190 70 172 56" stroke="#D9534F" stroke-dasharray="4 6"/>
  </g>
  <!-- break mark -->
  <g transform="translate(182,86)">
    <path d="M-12 -10 L-2 0 L-10 6 L2 16" fill="none" stroke="#D9534F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Data: watch -->
  <g transform="translate(140,40)">
    <rect x="-8" y="-30" width="16" height="12" rx="2" fill="#888"/><rect x="-8" y="18" width="16" height="12" rx="2" fill="#888"/>
    <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#4A7BB7"/>
    <path d="M-14 2 H-6 L-2 -8 L3 10 L7 2 H14" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Interpretation: thought -->
  <g transform="translate(52,140)">
    <circle r="22" fill="#FDF3DC" stroke="#F2A541" stroke-width="3"/>
    <text x="0" y="8" font-size="24" font-weight="700" fill="#F2A541" text-anchor="middle">?</text>
  </g>
  <!-- Action -->
  <g transform="translate(190,140)">
    <circle r="22" fill="#F4F4F4" stroke="#bbb" stroke-width="3"/>
    <path d="M-8 -10 L10 0 L-8 10 Z" fill="#bbb"/>
  </g>
  <g font-size="12" font-weight="700" fill="#888" text-anchor="middle">
    <text x="140" y="88">data</text>
    <text x="52" y="180">interpret</text>
    <text x="190" y="180">act</text>
  </g>
  </g>
  <text x="120" y="219" class="cap">Broken Data Loop</text>
</svg>
