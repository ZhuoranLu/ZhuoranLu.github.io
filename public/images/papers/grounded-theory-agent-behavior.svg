<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Helvetica, Arial, sans-serif">
  <style>.cap{font-size:18px;font-weight:700;fill:#222;text-anchor:middle}</style>
  <rect width="240" height="240" fill="#fff"/>
  <g id="art" transform="translate(2.4 -2.6) scale(0.972)">
  <!-- stack of agent logs -->
  <g transform="translate(14,40)">
    <rect x="12" y="0" width="52" height="64" rx="4" fill="#F4F4F4" stroke="#bbb" stroke-width="2"/>
    <rect x="6" y="6" width="52" height="64" rx="4" fill="#F4F4F4" stroke="#bbb" stroke-width="2"/>
    <rect x="0" y="12" width="52" height="64" rx="4" fill="#fff" stroke="#555" stroke-width="2.5"/>
    <g stroke-width="3" stroke-linecap="round">
      <line x1="8" y1="24" x2="40" y2="24" stroke="#999"/>
      <line x1="8" y1="34" x2="44" y2="34" stroke="#F2A541"/>
      <line x1="8" y1="44" x2="32" y2="44" stroke="#999"/>
      <line x1="8" y1="54" x2="42" y2="54" stroke="#5BA888"/>
      <line x1="8" y1="64" x2="36" y2="64" stroke="#D9534F"/>
    </g>
    <text x="33" y="100" font-size="12" font-weight="700" fill="#888" text-anchor="middle">logs</text>
  </g>
  <path d="M84 84 H100" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 78 L103 84 L96 90" stroke="#888" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- codes -->
  <g transform="translate(110,34)" font-size="12" font-weight="700" fill="#fff">
    <rect x="0" y="0" width="40" height="18" rx="9" fill="#F2A541"/>
    <rect x="6" y="26" width="40" height="18" rx="9" fill="#5BA888"/>
    <rect x="0" y="52" width="40" height="18" rx="9" fill="#D9534F"/>
    <rect x="6" y="78" width="40" height="18" rx="9" fill="#F2A541"/>
    <rect x="0" y="104" width="40" height="18" rx="9" fill="#5BA888"/>
    <text x="23" y="138" font-size="12" fill="#888" text-anchor="middle">codes</text>
  </g>
  <path d="M162 84 H176" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <path d="M172 78 L179 84 L172 90" stroke="#888" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- theory hierarchy -->
  <g transform="translate(184,40)">
    <g stroke="#555" stroke-width="2.5">
      <line x1="22" y1="14" x2="8" y2="44"/><line x1="22" y1="14" x2="36" y2="44"/>
      <line x1="8" y1="44" x2="4" y2="74"/><line x1="8" y1="44" x2="16" y2="74"/><line x1="36" y1="44" x2="36" y2="74"/>
    </g>
    <circle cx="22" cy="12" r="10" fill="#4A7BB7"/>
    <circle cx="8" cy="44" r="8" fill="#6E9BD0"/><circle cx="36" cy="44" r="8" fill="#6E9BD0"/>
    <circle cx="4" cy="76" r="6" fill="#F2A541"/><circle cx="16" cy="76" r="6" fill="#5BA888"/><circle cx="36" cy="76" r="6" fill="#D9534F"/>
    <text x="22" y="106" font-size="12" font-weight="700" fill="#888" text-anchor="middle">theory</text>
  </g>
  </g>
  <text x="120" y="207" class="cap">Grounded Theory</text>
  <text x="120" y="228" class="cap">at Scale</text>
