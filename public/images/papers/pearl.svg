  </g>
  <g stroke="#888" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 72 H82"/><path d="M78 67 L84 72 L78 77"/>
    <path d="M138 72 H160"/><path d="M156 67 L162 72 L156 77"/>
    <path d="M192 96 V118"/><path d="M187 114 L192 120 L197 114"/>
  </g>
