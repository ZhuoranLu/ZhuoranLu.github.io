    <line x1="13" y1="13" x2="24" y2="24" stroke="#4A7BB7" stroke-width="6" stroke-linecap="round"/>
    <text y="46" font-size="12" font-weight="700" fill="#888" text-anchor="middle">retrieve</text>
  </g>
  <!-- LLM -->
  <g transform="translate(192,72)">
