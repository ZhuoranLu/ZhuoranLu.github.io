<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Helvetica, Arial, sans-serif">
  <style>.cap{font-size:18px;font-weight:700;fill:#222;text-anchor:middle}</style>
  <rect width="240" height="240" fill="#fff"/>
  <g id="art" transform="translate(2.5 -10.8) scale(1.016)">
  <!-- user's past docs -->
  <g transform="translate(16,38)">
    <rect x="8" y="0" width="44" height="56" rx="4" fill="#FDF3DC" stroke="#F2A541" stroke-width="2"/>
    <rect x="4" y="6" width="44" height="56" rx="4" fill="#FDF3DC" stroke="#F2A541" stroke-width="2"/>
    <rect x="0" y="12" width="44" height="56" rx="4" fill="#fff" stroke="#F2A541" stroke-width="2.5"/>
    <path d="M8 26 H36 M8 36 H32 M8 46 H36 M8 56 H24" stroke="#F2A541" stroke-width="3" stroke-linecap="round"/>
    <text x="26" y="88" font-size="12" font-weight="700" fill="#888" text-anchor="middle">your docs</text>
  </g>
  <!-- retriever -->
  <g transform="translate(106,72)">
