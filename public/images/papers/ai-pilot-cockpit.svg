<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Helvetica, Arial, sans-serif">
  <style>.cap{font-size:18px;font-weight:700;fill:#222;text-anchor:middle}</style>
  <rect width="240" height="240" fill="#fff"/>
  <g id="art" transform="translate(-22.8 -8.7) scale(1.133)">
  <!-- airplane -->
  <g transform="translate(120,72)">
    <path d="M-80 0 C-80 -18 -60 -26 -30 -26 H60 C80 -26 96 -12 96 0 C96 12 80 22 60 22 H-60 C-74 22 -80 12 -80 0 Z" fill="#EAF1F9" stroke="#4A7BB7" stroke-width="3"/>
    <path d="M-6 18 L-30 46 H-14 L22 20 Z" fill="#6E9BD0"/>
    <path d="M-66 -20 L-84 -52 H-70 L-46 -24 Z" fill="#6E9BD0"/>
    <g fill="#fff" stroke="#9DB9DC" stroke-width="2">
      <circle cx="-40" cy="-2" r="6"/><circle cx="-20" cy="-2" r="6"/><circle cx="0" cy="-2" r="6"/><circle cx="20" cy="-2" r="6"/>
    </g>
    <!-- cockpit window with robot -->
    <path d="M56 -20 H70 C82 -18 90 -10 92 -2 H56 Z" fill="#4A7BB7"/>
    <rect x="62" y="-16" width="18" height="12" rx="3" fill="#fff"/>
    <circle cx="68" cy="-10" r="2" fill="#4A7BB7"/><circle cx="75" cy="-10" r="2" fill="#4A7BB7"/>
    <line x1="71" y1="-16" x2="71" y2="-22" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- public reactions -->
  <g transform="translate(0,150)">
    <g transform="translate(56,0)"><circle cy="-6" r="9" fill="#5BA888"/><path d="M-15 20 Q0 -2 15 20 Z" fill="#5BA888"/></g>
    <g transform="translate(120,0)"><circle cy="-6" r="9" fill="#bbb"/><path d="M-15 20 Q0 -2 15 20 Z" fill="#bbb"/></g>
    <g transform="translate(184,0)"><circle cy="-6" r="9" fill="#D9534F"/><path d="M-15 20 Q0 -2 15 20 Z" fill="#D9534F"/></g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="80" y="-12" fill="#5BA888">✓</text>
      <text x="144" y="-12" fill="#999">?</text>
      <text x="208" y="-12" fill="#D9534F">✗</text>
    </g>
  </g>
  </g>
  <text x="120" y="207" class="cap">Would You Fly</text>
  <text x="120" y="228" class="cap">with an AI Pilot?</text>
