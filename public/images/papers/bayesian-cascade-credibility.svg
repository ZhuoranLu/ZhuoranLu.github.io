<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Helvetica, Arial, sans-serif">
  <style>.cap{font-size:18px;font-weight:700;fill:#222;text-anchor:middle}</style>
  <rect width="240" height="240" fill="#fff"/>
  <g id="art" transform="translate(3.4 4.3) scale(0.971)">
  <!-- AI signal -->
  <g transform="translate(120,26)">
    <rect x="-44" y="-16" width="88" height="30" rx="15" fill="#FBEAEA" stroke="#D9534F" stroke-width="2.5"/>
    <text x="0" y="5" font-size="14" font-weight="700" fill="#D9534F" text-anchor="middle">AI: false?</text>
  </g>
  <!-- cascade edges -->
  <g stroke="#bbb" stroke-width="3">
    <line x1="120" y1="42" x2="120" y2="62"/>
    <line x1="120" y1="80" x2="70" y2="112"/><line x1="120" y1="80" x2="170" y2="112"/>
    <line x1="70" y1="130" x2="40" y2="164"/><line x1="70" y1="130" x2="100" y2="164"/>
    <line x1="170" y1="130" x2="140" y2="164"/><line x1="170" y1="130" x2="200" y2="164" stroke-dasharray="4 4"/>
  </g>
  <!-- people with belief bars -->
  <g>
    <g transform="translate(120,74)"><circle r="12" fill="#4A7BB7"/><circle cy="-3" r="4" fill="#fff"/><path d="M-6 7 Q0 1 6 7" stroke="#fff" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(70,122)"><circle r="12" fill="#6E9BD0"/><circle cy="-3" r="4" fill="#fff"/><path d="M-6 7 Q0 1 6 7" stroke="#fff" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(170,122)"><circle r="12" fill="#6E9BD0"/><circle cy="-3" r="4" fill="#fff"/><path d="M-6 7 Q0 1 6 7" stroke="#fff" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(40,174)"><circle r="11" fill="#9DB9DC"/><circle cy="-3" r="3.5" fill="#fff"/><path d="M-5 6 Q0 1 5 6" stroke="#fff" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(100,174)"><circle r="11" fill="#9DB9DC"/><circle cy="-3" r="3.5" fill="#fff"/><path d="M-5 6 Q0 1 5 6" stroke="#fff" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(140,174)"><circle r="11" fill="#9DB9DC"/><circle cy="-3" r="3.5" fill="#fff"/><path d="M-5 6 Q0 1 5 6" stroke="#fff" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(200,174)"><circle r="11" fill="#F4F4F4" stroke="#ccc" stroke-width="2"/></g>
  </g>
  <!-- belief bars -->
  <g>
    <rect x="136" y="66" width="24" height="6" rx="3" fill="#F4F4F4"/><rect x="136" y="66" width="20" height="6" rx="3" fill="#D9534F"/>
    <rect x="30" y="118" width="24" height="6" rx="3" fill="#F4F4F4"/><rect x="30" y="118" width="14" height="6" rx="3" fill="#D9534F"/>
    <rect x="186" y="118" width="24" height="6" rx="3" fill="#F4F4F4"/><rect x="186" y="118" width="8" height="6" rx="3" fill="#D9534F"/>
  </g>
  </g>
  <text x="120" y="207" class="cap">One Signal,</text>
  <text x="120" y="228" class="cap">Many Judgments</text>
</svg>
