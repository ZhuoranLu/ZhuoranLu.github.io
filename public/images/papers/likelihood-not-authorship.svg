<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Helvetica, Arial, sans-serif">
  <style>.cap{font-size:18px;font-weight:700;fill:#222;text-anchor:middle}</style>
  <rect width="240" height="240" fill="#fff"/>
  <g id="art">
  <!-- likelihood: probability curve on axes -->
  <g>
    <line x1="26" y1="58" x2="26" y2="134" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="134" x2="100" y2="134" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 130 C48 130 52 72 63 72 C74 72 78 130 98 130" fill="none" stroke="#4A7BB7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="63" cy="72" r="5" fill="#4A7BB7"/>
  </g>
  <!-- not equal -->
  <g transform="translate(120,98)" stroke="#D9534F" stroke-width="4" stroke-linecap="round">
    <line x1="-11" y1="-7" x2="11" y2="-7"/>
    <line x1="-11" y1="7" x2="11" y2="7"/>
    <line x1="-8" y1="15" x2="8" y2="-15"/>
  </g>
  <!-- authorship: signed page -->
  <g>
    <rect x="144" y="54" width="68" height="84" rx="7" fill="#fff" stroke="#555" stroke-width="3"/>
    <line x1="156" y1="72" x2="200" y2="72" stroke="#B3B3B3" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="84" x2="200" y2="84" stroke="#B3B3B3" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="96" x2="186" y2="96" stroke="#B3B3B3" stroke-width="4" stroke-linecap="round"/>
    <path d="M156 122 C164 110 168 128 176 118 C182 110 186 124 198 114" fill="none" stroke="#F2A541" stroke-width="4" stroke-linecap="round"/>
  </g>
  </g>
  <text x="120" y="207" class="cap">Likelihood ≠</text>
  <text x="120" y="228" class="cap">Authorship</text>
</svg>
