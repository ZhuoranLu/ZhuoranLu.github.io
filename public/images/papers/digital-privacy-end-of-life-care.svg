    <rect x="-18" y="2" width="36" height="8" rx="2" fill="#D9534F"/>
    <line x1="-18" y1="-10" x2="-18" y2="14" stroke="#D9534F" stroke-width="3"/>
    <line x1="18" y1="4" x2="18" y2="14" stroke="#D9534F" stroke-width="3"/>
    <circle cx="-9" cy="-4" r="5" fill="#D9534F"/>
